name: CI

# Corre en cada PR y en push a main. Tres frentes independientes en paralelo:
#  - api:      typecheck + lint + build + unit tests, y rules/integration contra el emulador.
#  - functions: install + syntax check de las Cloud Functions.
#  - frontend: invoca SOLO los scripts npm del frontend (NO creamos config dentro de frontend/).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit -- --coverage

  api-emulator:
    name: API rules + integracion (emulador Firebase)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # el SDK client 'firebase' solo se necesita para los tests de reglas; lo instalamos
      # aqui (no es dep local para no inflar el node_modules de dev).
      - run: npm install --no-save firebase@^10.14.1
      # firebase-tools trae los emuladores. Lo instalamos global solo en CI.
      - run: npm install -g firebase-tools
      # levantamos firestore + storage + auth y corremos los tests dentro del contexto del emulador.
      # firebase emulators:exec arranca, corre el comando y apaga al terminar.
      - name: Tests de reglas e integracion contra emulador
        run: |
          firebase emulators:exec \
            --project vethosia-production \
            --only firestore,storage,auth \
            "npm run test:rules && npm run test:integration"
        env:
          # emulators:exec ya setea los *_EMULATOR_HOST, pero lo dejamos explicito por claridad.
          GCLOUD_PROJECT: vethosia-production

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      # functions es JS plano: validamos sintaxis de los modulos principales.
      - run: node --check index.js
      - run: node --check email.js

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ""
      VITE_FIREBASE_AUTH_DOMAIN: vethosia-production.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: vethosia-production
      VITE_FIREBASE_STORAGE_BUCKET: vethosia-production.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: ""
      VITE_FIREBASE_APP_ID: ""
      VITE_FIREBASE_MEASUREMENT_ID: ""
      VITE_USE_FIREBASE_EMULATORS: "false"
      VITE_API_BASE_URL: https://vetia-api-cwepwj6irq-uc.a.run.app
      VITE_USE_API_HC: "true"
      VITE_USE_API_IA: "true"
      VITE_USE_API_DOCS: "true"
      VITE_USE_API_CRUD: "true"
      VITE_WHATSAPP_COUNTRY_CODE: "57"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # vitest DEBE correr en CI (antes solo lint+build). 'run' = sin watch.
      - run: npm run test:run
      - run: npm run build
